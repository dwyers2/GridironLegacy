<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynasty Alchemy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Barlow+Condensed:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --obsidian:      #0C0F16;
        --surface:       #131822;
        --surface-2:     #1A2235;
        --border:        rgba(212, 160, 23, 0.12);
        --border-muted:  rgba(255, 255, 255, 0.09);
        --gold:          #D4A017;
        --gold-bright:   #F0C040;
        --gold-dim:      rgba(212, 160, 23, 0.08);
        --text-primary:  #F5F0E8;
        --text-secondary:#8A9BB5;
        --text-muted:    #627B9E;
        --green:         #22A85F;
        --red:           #E05252;
      }

      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--obsidian);
        color: var(--text-primary);
        margin: 0;
      }

      ::selection { background: rgba(212, 160, 23, 0.25); }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--surface); }
      ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }

      @keyframes pulse-gold {
        0%, 100% { box-shadow: 0 0 40px rgba(212,160,23,0.2); }
        50%       { box-shadow: 0 0 70px rgba(212,160,23,0.35); }
      }

      @keyframes fade-up {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      .animate-fade-up   { animation: fade-up 0.7s ease forwards; }
      .animate-fade-up-2 { animation: fade-up 0.7s 0.15s ease both; }
      .animate-fade-up-3 { animation: fade-up 0.7s 0.30s ease both; }
      .animate-fade-up-4 { animation: fade-up 0.7s 0.45s ease both; }
      .animate-fade-up-5 { animation: fade-up 0.7s 0.60s ease both; }

      .btn-gold:hover {
        box-shadow: 0 0 60px rgba(212,160,23,0.45) !important;
        transform: translateY(-2px) !important;
      }

      .feature-card:hover {
        background: var(--surface-2) !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "axios": "https://esm.sh/axios@^1.13.2",
    "express": "https://esm.sh/express@^5.2.1",
    "url": "https://esm.sh/url@^0.11.4",
    "cors": "https://esm.sh/cors@^2.8.5",
    "express-dom": "https://esm.sh/express-dom@^9.0.12"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <!-- Explicitly import entry point for build tool compatibility -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
